version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fsw_reels
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  orchestrator:
    build: .
    command: uvicorn orchestrator.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage

  worker:
    build: .
    command: celery -A orchestrator.tasks worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage

  telegram_bot:
    build: .
    command: python telegram_bot/bot.py
    depends_on:
      - orchestrator
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
